name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Valeurs factices réservées à la CI — ne doivent jamais servir en production.
      # DATABASE_URL : `prisma generate` lit seulement le provider, pas la DB elle-même.
      # JWT_SECRET   : requis pour que le build n'échoue pas sur la validation de config.
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-only-jwt-secret-not-used-in-production-64-chars-minimum-xxxxxx

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Indispensable : `tsc --noEmit` et Jest dépendent des types générés par Prisma
      # (sinon les retours de findMany/findUnique sont `any` → erreurs implicit any
      # sur toutes les callbacks .map/.filter + "PrismaClient has no exported member"
      # dans prisma/seed.ts).
      - name: Generate Prisma client
        run: npx prisma generate

      # Pousse le schéma sur la DB SQLite avant tests + build. Les tests Jest sont
      # censés mocker tous les loaders Prisma (cf. patterns dans __tests__/),
      # mais un oubli de mock ferait tomber le test sur la vraie DB. Avec le
      # schéma en place, l'oubli produit au pire un résultat vide (`findMany`
      # retourne []) plutôt qu'un crash P2021 "table does not exist" — défense
      # en profondeur contre les régressions de test setup.
      # Conserve aussi l'usage initial : `next build` prérend des pages qui
      # appellent prisma.*.findMany() (ex. /agents).
      - name: Create SQLite schema
        run: npx prisma db push --accept-data-loss

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Jest)
        run: npm test -- --ci

      - name: Build (next build)
        run: npm run build
